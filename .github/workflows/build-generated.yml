# Rebuilds the generated pages (hotel/guide pages, sitemap, Supabase seed) whenever source files are pushed to staging.
# The daily hotel task therefore only has to upload data.js, articles/*.json, guides/*.json and the logs.
name: Build generated pages
on:
  push:
    branches: [staging]
permissions:
  contents: write
concurrency:
  group: build-generated
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]' && github.actor != 'daily-publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          node tools/build-pages.js
          node tools/sync-supabase-seed.js
      - name: Commit generated files
        run: |
          git config user.name daily-publish
          git config user.email daily-publish@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'Build generated pages'
          git pull --rebase origin staging
          git push origin HEAD:staging
