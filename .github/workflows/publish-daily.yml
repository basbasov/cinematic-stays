# Publishes everything collected on the "staging" branch to "main" (which Netlify deploys)
# about every other day around 23:59 Israel time, then opens a GitHub issue (assigned to the owner, so GitHub emails it)
# listing what went live. If staging has nothing new, nothing happens and no deploy is used.
# GitHub often skips or delays single scheduled runs, so a run is attempted every hour overnight
# (20:05-03:05 UTC = 22:05-06:05 Israel). Each run publishes only if (1) it is 23:00-05:59 in Israel and
# (2) the last publish was 28+ hours ago, so at most one publish happens per window.
name: Publish every other day
on:
  schedule:
    - cron: "5 20-23 * * *"
    - cron: "5 0-3 * * *"
  workflow_dispatch:         # lets you run it manually from the Actions tab
permissions:
  contents: write
  issues: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge staging into main and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            H=$((10#$(TZ=Asia/Jerusalem date +%H)))
            if [ "$H" -ge 6 ] && [ "$H" -lt 23 ]; then
              echo "Not night in Israel yet; skipping."; exit 0
            fi
            AGE=$(( $(date +%s) - $(git log -1 --merges --format=%ct origin/main) ))
            if [ "$AGE" -lt 100800 ]; then
              echo "Last publish was less than 40 hours ago (publishing every other day); skipping."; exit 0
            fi
          fi
          git config user.name "daily-publish"
          git config user.email "daily-publish@users.noreply.github.com"
          git fetch origin staging || { echo "No staging branch"; exit 0; }
          if [ "$(git rev-list --count origin/main..origin/staging)" = "0" ]; then
            echo "Nothing new to publish."; exit 0
          fi
          CHANGES=$(git log --no-merges --pretty='- %s' origin/main..origin/staging)
          ALL=$(git diff --name-only origin/main origin/staging)
          NART=$(echo "$ALL" | grep -c '^articles/' || true)
          FILES=$(echo "$ALL" | grep -v -e '^hotels/' -e '^guides/.*\.html$' -e '^articles/' | sed 's/^/- /')
          git merge origin/staging --no-edit
          git push origin main
          printf '@basbasov your site was just deployed: https://cinematicstay.com\n\n### What was deployed\n%s\n\n### Other files changed (generated hotel and guide pages not listed)\n%s\n\nArticle files changed: %s\n' "$CHANGES" "$FILES" "$NART" > body.md
          gh issue create --assignee basbasov --title "Deployed $(date -u +%Y-%m-%d): $(echo "$CHANGES" | wc -l) change(s)" --body-file body.md
