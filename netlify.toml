# ============================================================
# CINEMATIC STAYS — NETLIFY CONFIG
# ============================================================
# This is a plain static site — no build step. Netlify just needs
# to know to publish the project folder as-is.
# ============================================================

[build]
  publish = "."
  # Save deploy credits: skip the build when only notes/docs changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!hotels-log.md' ':!README.md' ':!supabase_schema.sql' ':!.gitignore' ':!MAINTENANCE.md' ':!backups' ':!tools' ':!.github'"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
